<form #blogForm="ngForm">

  <div class="modal-backdrop">

    <div class="modal-container">

      <div class="modal-header">

        <h2>{{ blogToEdit ? 'Edit Blog' : 'Add New Blog' }}</h2>

        <button
          type="button"
          class="close-btn"
          (click)="closeModal()">
          ×
        </button>

      </div>

      <div class="form-grid">

        <!-- TITLE -->

        <div class="full-width">

          <label>Blog Title</label>

          <input
            type="text"
            name="title"
            [(ngModel)]="newBlog.title"
            #title="ngModel"
            required
            placeholder="Enter blog title">

          <small
            class="validation-error"
            *ngIf="title.invalid && title.touched">

            Title is required

          </small>

        </div>

        <!-- AUTHOR -->

        <div>

          <label>Author</label>

          <input
            type="text"
            name="author"
            [(ngModel)]="newBlog.author"
            #author="ngModel"
            required
            placeholder="Author name">

          <small
            class="validation-error"
            *ngIf="author.invalid && author.touched">

            Author is required

          </small>

        </div>

        <!-- IMAGE URL -->

        <div>

          <label>Image URL</label>

          <input
            type="text"
            name="imageUrl"
            [(ngModel)]="newBlog.imageUrl"
            #imageUrl="ngModel"
            required
            placeholder="Paste image URL">

          <small
            class="validation-error"
            *ngIf="imageUrl.invalid && imageUrl.touched">

            Image URL is required

          </small>

        </div>

        <!-- BODY -->

        <div class="full-width">

          <label>Blog Body</label>

          <textarea
            rows="10"
            name="body"
            [(ngModel)]="newBlog.body"
            #body="ngModel"
            required
            placeholder="Write blog content">
          </textarea>

          <small
            class="validation-error"
            *ngIf="body.invalid && body.touched">

            Blog body is required

          </small>

        </div>

      </div>

      <div class="modal-actions">

        <button
          type="button"
          class="cancel-btn"
          (click)="closeModal()">

          Cancel

        </button>

        <button
          type="submit"
          class="save-btn"
          [disabled]="blogForm.invalid"
          (click)="saveModal()">
          
          {{ blogToEdit ? 'Edit Blog' : 'Save Blog' }}

        </button>

      </div>

    </div>

  </div>

</form>
